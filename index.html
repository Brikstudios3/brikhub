  <div class="tkrow">${tkIn("dep","Deposit","%")}${tkIn("rate","Interest rate","%")}${tkIn("term","Term","years",{mode:"numeric"})}</div>
  <div class="fgroup"><span>Mortgage type</span>${segBtns("mode",[["repay","Repayment"],["io","Interest only"]])}</div>
  <p class="small muted" style="margin:0">Most buy to let mortgages are interest only. Stamp duty uses the buyer type from the stamp duty tab: ${esc(SDT[S.sd.type][0].toLowerCase())}.</p>`}

/* capital growth */
function growCalc(){const s=S.sd,P=num(s.price),g=num(s.growth)/100,N=Math.max(1,Math.min(30,Math.round(num(s.years))));
  const series=Array.from({length:N+1},(_,i)=>P*Math.pow(1+g,i));const v=series[N];
  return {P,g,N,v,gain:v-P,up:P?(v-P)/P:0,series,rows:[1,3,5,10,15,20,25,30].filter(y=>y<=N).concat(N).filter((y,i,a)=>a.indexOf(y)===i).map(y=>({y,v:series[y],gain:series[y]-P}))}}
function growChart(c){if(!c.P)return "";const W=520,H=170,mx=c.v||1,bw=W/(c.N+1);
  return `<svg class="gchart" viewBox="0 0 ${W} ${H+22}" role="img" aria-label="Value each year">${c.series.map((v,i)=>{const h=Math.max(2,(v/mx)*H);return `<rect x="${(i*bw+bw*.18).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${h.toFixed(1)}" fill="${i===c.N?"#fff":i===0?"rgba(255,255,255,.35)":"rgba(255,255,255,.55)"}"><title>Year ${i}: ${gbp2(v)}</title></rect>`}).join("")}
   <text x="0" y="${H+16}" fill="rgba(255,255,255,.6)" font-size="11">Today</text><text x="${W}" y="${H+16}" fill="rgba(255,255,255,.6)" font-size="11" text-anchor="end">Year ${c.N}</text></svg>`}
function growOut(){const c=growCalc();
  return `<div><div class="eyebrow">Value after ${c.N} years${tkLab()}</div><div class="tot num">${gbp2(c.v)}</div></div>
   <div class="eff">${c.P?`A gain of <b>${gbp2(c.gain)}</b>, up ${pctR(c.up)} on ${gbp2(c.P)} at ${num(S.sd.growth)}% a year`:"Enter a purchase price to see the projection."}</div>
   ${growChart(c)}
   ${c.P?`<table class="btbl"><thead><tr><th>Year</th><th class="r">Value</th><th class="r">Gain</th></tr></thead><tbody>${c.rows.map(r=>`<tr><td>${r.y}</td><td class="r">${gbp2(r.v)}</td><td class="r">${gbp2(r.gain)}</td></tr>`).join("")}</tbody></table>`:""}
   <p class="cnote">Compound growth at a steady rate. An assumption to plan with, not a forecast; values can fall as well as rise.</p>${tkActs("growth")}`}
function growIn(){return `${priceBlock()}
  <div class="tkrow">${tkIn("growth","Growth a year","%")}${tkIn("years","Years held","years",{mode:"numeric"})}</div>
  <div class="fgroup"><span>Quick rates</span><div style="display:flex;flex-wrap:wrap">${[2,3,4,5,6].map(g=>`<button type="button" class="qchip" data-act="tkset" data-k="growth" data-v="${g}" aria-pressed="${num(S.sd.growth)===g}">${g}%</button>`).join("")}</div></div>
  <p class="small muted" style="margin:0">Our scheme figures use 4% a year. Pick a unit to start from its price.</p>`}

/* return on investment */
function roiCalc(){const s=S.sd,P=num(s.price),dep=Math.min(100,num(s.rdep)),loan=P*(1-dep/100),N=Math.max(1,Math.min(30,Math.round(num(s.ryears))));
  const sd=sdltCalc(P,s.type,s.overseas).total,legal=num(s.legal),cash=P*dep/100+sd+legal;
  const R=num(s.rent),gross=R*12,sc=num(s.sc),gr=num(s.gr),mg=gross*num(s.mgmt)/100,mort=loan*num(s.rrate)/100;
  const netPre=gross-mg-sc-gr,net=netPre-mort;let cum=0;const rg=num(s.rgrowth)/100;
  for(let n=1;n<=N;n++){const g=gross*Math.pow(1+rg,n-1);cum+=g-g*num(s.mgmt)/100-sc-gr-mort}
  const val=P*Math.pow(1+num(s.growth)/100,N),gain=val-P,total=gain+cum;
  return {P,dep,loan,N,sd,legal,cash,R,gross,sc,gr,mg,mort,netPre,net,gy:P?gross/P:0,ny:P?netPre/P:0,coc:cash?net/cash:0,cum,val,gain,total,roi:cash?total/cash:0}}
function roiOut(){const c=roiCalc();
  return `<div><div class="eyebrow">Return on cash after ${c.N} years${tkLab()}</div><div class="tot num">${c.P&&c.R?pctR(c.roi):"0%"}</div></div>
   <div class="eff">${c.P&&c.R?`A total return of <b>${gbp2(c.total)}</b> on <b>${gbp2(c.cash)}</b> put in: ${gbp2(c.gain)} growth and ${gbp2(c.cum)} income`:"Enter a price and a monthly rent to see the return."}</div>
   <div class="ostats"><div><span>Gross yield</span><b>${pctR(c.gy)}</b></div><div><span>Net yield</span><b>${pctR(c.ny)}</b></div><div><span>Net income a month</span><b>${gbp2(c.net/12)}</b></div><div><span>Cash on cash</span><b>${pctR(c.coc)}</b></div></div>
   <table class="btbl"><thead><tr><th>A year of income</th><th class="r"></th></tr></thead><tbody>
    <tr><td>Rent</td><td class="r">${gbp2(c.gross)}</td></tr><tr><td>Less lettings and management</td><td class="r">${gbp2(c.mg)}</td></tr><tr><td>Less service charge and ground rent</td><td class="r">${gbp2(c.sc+c.gr)}</td></tr><tr><td>Less mortgage interest</td><td class="r">${gbp2(c.mort)}</td></tr>
   </tbody><tfoot><tr><td>Net income</td><td class="r">${gbp2(c.net)}</td></tr></tfoot></table>
   <table class="btbl"><thead><tr><th>Cash put in</th><th class="r"></th></tr></thead><tbody>
    <tr><td>Deposit, ${c.dep}%</td><td class="r">${gbp2(c.P*c.dep/100)}</td></tr><tr><td>Stamp duty, ${esc(SDT[S.sd.type][0].toLowerCase())}</td><td class="r">${gbp2(c.sd)}</td></tr><tr><td>Legal fees</td><td class="r">${gbp2(c.legal)}</td></tr>
   </tbody><tfoot><tr><td>Total</td><td class="r">${gbp2(c.cash)}</td></tr></tfoot></table>
   <p class="cnote">Interest only mortgage, before tax. Rent grows ${num(S.sd.rgrowth)}% and value ${num(S.sd.growth)}% a year. Illustrations, not guarantees.</p>${tkActs("roi")}`}
function roiIn(){return `${priceBlock()}
  <div class="tkrow">${tkIn("rent","Monthly rent","",{pre:"£",mode:"numeric"})}${tkIn("rdep","Deposit","%")}${tkIn("rrate","Interest only rate","%")}</div>
  <div class="tkrow">${tkIn("sc","Service charge a year","",{pre:"£",mode:"numeric"})}${tkIn("gr","Ground rent a year","",{pre:"£",mode:"numeric"})}${tkIn("mgmt","Management","%")}</div>
  <div class="tkrow">${tkIn("growth","Capital growth","% a yr")}${tkIn("rgrowth","Rent growth","% a yr")}${tkIn("ryears","Years held","years",{mode:"numeric"})}</div>
  ${tkIn("legal","Legal fees","",{pre:"£",mode:"numeric"})}
  <p class="small muted" style="margin:0">Pick a BRIK unit to fill in its price, our rent estimate and the service charge. Management at 12% is the FLOC fee of 10% plus VAT.</p>`}

const TOUT={sdlt:()=>sdOutHTML(),mortgage:mortOut,growth:growOut,roi:roiOut};
function sdltIn(){const s=S.sd;return `${priceBlock()}
  <div class="fgroup"><span>Buyer</span><div class="btype" role="group" aria-label="Buyer type">${Object.entries(SDT).map(([k,[t,d]])=>`<button type="button" data-act="sdtype" data-v="${k}" aria-pressed="${s.type===k}"><b>${t}</b><small>${d}</small></button>`).join("")}</div></div>
  <label class="tog" for="sd-os"><input type="checkbox" id="sd-os" ${s.overseas?"checked":""}><span class="sw" aria-hidden="true"></span><span><b>Overseas buyer</b><small>Not UK resident for stamp duty: in the UK under 183 days of the last 12 months. Adds 2%.</small></span></label>`}
const TIN={sdlt:sdltIn,mortgage:mortIn,growth:growIn,roi:roiIn};
function vTools(t){t=TOOLS[t]?t:"sdlt";S.tool=t;const T0=TOOLS[t];
  return `<main>
  <section class="thero"><img src="${T0.img}" alt=""><div class="cap"><div class="wrap"><div class="chips2">${chip("Toolkit","lt")}</div><h1>${esc(T0.t)}</h1><p>${t==="sdlt"?"Every buyer type in one place. ":""}Work it out with your client, then print the calculation under your own branding.</p></div></div></section>
  <section class="band"><div class="wrap">
   <nav class="tktabs" aria-label="Toolkit">${Object.entries(TOOLS).filter(([k])=>k!=="growth").concat([["mailers",{hash:"mailers",t:"Mail shots",d:"Three ready made emails for your database",img:"img2/pl-crowd.jpg"}]]).map(([k,x])=>`<a href="#${x.hash}" ${k===t?'aria-current="page"':""}><img src="${x.img}" alt="" loading="lazy"><span><b>${esc(x.t)}</b><small>${esc(x.d)}</small></span></a>`).join("")}</nav>
   <div class="calc"><div class="cin">${TIN[t]()}</div><div class="cout" id="sdOut" aria-live="polite">${TOUT[t]()}</div></div>
   ${t==="sdlt"?`<div class="rates">
    <div><h3>Standard rates</h3><dl><div><dt>Up to £125,000</dt><dd>0%</dd></div><div><dt>£125,001 to £250,000</dt><dd>2%</dd></div><div><dt>£250,001 to £925,000</dt><dd>5%</dd></div><div><dt>£925,001 to £1.5m</dt><dd>10%</dd></div><div><dt>Above £1.5m</dt><dd>12%</dd></div></dl></div>
    <div><h3>First time buyers</h3><dl><div><dt>Up to £300,000</dt><dd>0%</dd></div><div><dt>£300,001 to £500,000</dt><dd>5%</dd></div><div><dt>Over £500,000</dt><dd>Standard rates</dd></div></dl></div>
    <div><h3>Surcharges</h3><dl><div><dt>Additional home</dt><dd>+5% every band</dd></div><div><dt>Overseas buyer</dt><dd>+2% every band</dd></div><div><dt>Companies over £500,000</dt><dd>Ask a solicitor</dd></div></dl></div>
   </div><p class="srcnote">Rates as published by HMRC on GOV.UK, checked 21 November 2026. Rates for Scotland and Wales differ.</p>`:""}
  </div></section></main>`}
function tkRefresh(){const o=$("#sdOut");if(o&&TOUT[S.tool])o.innerHTML=TOUT[S.tool]()}

/* summaries and print */
function tkSummary(k){const s=S.sd,lab=s.label?" ("+s.label+")":"";
  if(k==="mortgage"){const c=mortCalc();return `Mortgage on ${gbp2(c.P)}${lab}\n${c.io?"Interest only":"Repayment"}, ${c.dep}% deposit, ${num(s.rate)}% over ${s.term} years\n\nMonthly payment: ${gbp2(c.pmt)}\nMortgage: ${gbp2(c.loan)}\nDeposit: ${gbp2(c.deposit)}\nStamp duty: ${gbp2(c.sd)}\nTotal repaid: ${gbp2(c.repaid)}\n\nAn illustration, not a mortgage offer.`}
  if(k==="growth"){const c=growCalc();return `Capital growth on ${gbp2(c.P)}${lab} at ${num(s.growth)}% a year\n\n${c.rows.map(r=>`Year ${r.y}: ${gbp2(r.v)} (gain ${gbp2(r.gain)})`).join("\n")}\n\nAn assumption, not a forecast.`}
  const c=roiCalc();return `Return on investment, ${gbp2(c.P)}${lab}\nRent ${gbp2(c.R)} a month, ${c.dep}% deposit, interest only at ${num(s.rrate)}%\n\nGross yield: ${pctR(c.gy)}\nNet yield: ${pctR(c.ny)}\nNet income a month: ${gbp2(c.net/12)}\nCash put in: ${gbp2(c.cash)}\nTotal return after ${c.N} years: ${gbp2(c.total)} (${pctR(c.roi)} on cash)\n\nIllustrations, not guarantees.`}
async function pdfCalc(k){const s=S.sd,d=await newDoc(),M=16,b=brandNow(),T0=TOOLS[k];const date=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  let inputs,big,big2,head,rows,foot,note,name;
  if(k==="mortgage"){const c=mortCalc();inputs=[["Purchase price",gbp2(c.P)],["Deposit",c.dep+"%, "+gbp2(c.deposit)],["Rate and term",num(s.rate)+"% over "+s.term+" yrs"]];big=["Monthly payment",gbp2(c.pmt)];big2=["Type",c.io?"Interest only":"Repayment"];
    head=[["",80],["",98,"r"]];rows=[["Mortgage",gbp2(c.loan)],["Deposit",gbp2(c.deposit)],["Stamp duty, "+SDT[s.type][0].toLowerCase(),gbp2(c.sd)],["Cash up front",gbp2(c.deposit+c.sd)],["Total interest",gbp2(c.interest)],["Total repaid",gbp2(c.repaid)]].concat(c.rows.map(r=>["Left to pay after "+r.y+" years",gbp2(r.bal)]));
    note="An illustration, not a mortgage offer. Rates, fees and affordability are confirmed by a mortgage broker or lender.";name=`Mortgage calculation ${gbp2(c.P).slice(1)}`}
  else if(k==="growth"){const c=growCalc();inputs=[["Purchase price",gbp2(c.P)],["Growth",num(s.growth)+"% a year"],["Held",c.N+" years"]];big=["Value after "+c.N+" years",gbp2(c.v)];big2=["Gain",gbp2(c.gain)];
    head=[["Year",60],["Value",59,"r"],["Gain",59,"r"]];rows=c.rows.map(r=>[String(r.y),gbp2(r.v),gbp2(r.gain)]);note="Compound growth at a steady rate. An assumption to plan with, not a forecast; values can fall as well as rise.";name=`Capital growth ${gbp2(c.P).slice(1)}`}
  else{const c=roiCalc();inputs=[["Purchase price",gbp2(c.P)],["Monthly rent",gbp2(c.R)],["Deposit",c.dep+"%, interest only "+num(s.rrate)+"%"]];big=["Return on cash, "+c.N+" years",pctR(c.roi)];big2=["Total return",gbp2(c.total)];
    head=[["",80],["",98,"r"]];rows=[["Gross yield",pctR(c.gy)],["Net yield",pctR(c.ny)],["Rent a year",gbp2(c.gross)],["Less lettings and management",gbp2(c.mg)],["Less service charge and ground rent",gbp2(c.sc+c.gr)],["Less mortgage interest",gbp2(c.mort)],["Net income a year",gbp2(c.net)],["Cash put in (deposit, stamp duty, legal)",gbp2(c.cash)],["Cash on cash",pctR(c.coc)],["Capital growth over "+c.N+" years",gbp2(c.gain)],["Income over "+c.N+" years",gbp2(c.cum)]];
    note=`Interest only mortgage, before tax. Rent grows ${num(s.rgrowth)}% and value ${num(s.growth)}% a year. Stamp duty at ${SDT[s.type][0].toLowerCase()} rates. Illustrations, not guarantees.`;name=`Return on investment ${gbp2(c.P).slice(1)}`}
  d.addImage(await crop(T0.img,210/92,1600),"JPEG",0,0,210,92);veil(d,0,0,210,92,.4);
  if(b.logo&&b.logoW){d.setFillColor(...C.light);d.rect(M,12,58,18,"F");fitImg(d,b.logo,M+4,14.5,50,13,b.logoW,b.logoH)}else if(b.company||b.consultant)T(d,b.company||b.consultant,M,22,{font:"Besley",size:13,color:C.cream});
  T(d,(T0.t+" calculation").toUpperCase(),M,68,{size:7.2,cs:.7,color:C.cream});T(d,T0.t,M,82,{font:"Besley",size:32,color:C.cream});
  let y=108;stats(d,M,y,178,inputs,{size:15});if(s.label)T(d,s.label,M,y+24,{size:8.6,color:C.muted});
  y=140;d.setFillColor(...C.darkest);d.rect(0,y,210,40,"F");T(d,big[0].toUpperCase(),M,y+12,{size:7,cs:.6,color:C.sand});T(d,big[1],M,y+30,{font:"Besley",size:34,color:C.cream});
  T(d,big2[0].toUpperCase(),132,y+12,{size:7,cs:.6,color:C.sand});T(d,big2[1],132,y+30,{font:"Besley",size:20,color:C.cream});
  y=194;EB(d,"The figures",M,y);y+=8;y=gridTbl(d,M,y,head.map(h=>[h[1],h[2]]),head.map(h=>h[0]),rows,{size:8.8,lh:7});
  P(d,`Prepared ${date}${b.consultant||b.company?" by "+[b.consultant,b.company].filter(Boolean).join(", "):""}. ${note}`,M,Math.max(y+6,262),178,{size:6.8,color:C.muted,lh:1.5});
  bFoot(d,T0.t);return {d,name:name+(s.label?", "+s.label:"")+".pdf"}}
async function printTool(k){if(k==="sdlt")return printSdlt();if(!num(S.sd.price)){toast("Enter a purchase price first");return}
  const done=busy("Laying out the calculation");let out;try{out=await pdfCalc(k)}catch(e){done();toast(e&&e.message&&/PDF tools/.test(e.message)?e.message:"The calculation could not be built. Try again.");return}done();
  const b=brandNow(),sum=tkSummary(k),T0=TOOLS[k];
  openSend(out,k,null,{subject:`${T0.t} calculation${S.sd.label?", "+S.sd.label:""}`,email:`Hello,\n\nAs promised, here is the ${T0.t.toLowerCase()} calculation we talked through. The figures are attached.\n\nKind regards,\n${[b.consultant,b.company,b.phone].filter(Boolean).join("\n")}`,
    whatsapp:`Hi, here is the ${T0.t.toLowerCase()} calculation we talked through. The figures are attached.`,phone:S.client.phone||"",to:S.client.email||"",client:"",facts:{summary:sum}})}
function bindTools(){document.querySelectorAll("[data-tk]").forEach(i=>i.addEventListener("input",()=>{S.sd[i.dataset.tk]=i.value;tkRefresh()}))}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  if(a==="tkseg"||a==="tkset"){S.sd[t.dataset.k]=a==="tkset"?t.dataset.v:t.dataset.v;document.querySelectorAll(`[data-act="${a}"][data-k="${t.dataset.k}"]`).forEach(x=>x.setAttribute("aria-pressed",x===t));const inp=$("#tk-"+t.dataset.k);if(inp)inp.value=t.dataset.v;tkRefresh()}
  else if(a==="tkprint")printTool(t.dataset.k);
  else if(a==="tkcopy")copyText(t.dataset.k==="sdlt"?sdSummary():tkSummary(t.dataset.k),"Figures copied")});
