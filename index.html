<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The BRIK Hub</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="host.css">
<script src="host.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Inter:wght@400;500&display=swap">
<style>
/* Layout: brik-studios.com bands. Charcoal header and hero panels, cream content grounds, Besley statements over a quiet grotesque, square edges, photography doing the colour. Single light look, as the BRIK design system. */
:root{
  --cream-light:#FCF5EF; --cream:#F3EFEC; --white:#FFFFFF;
  --charcoal:#454545; --charcoal-dark:#373737; --charcoal-darkest:#292523;
  --terracotta:#A85531; --sage:#9D9981; --hairline:#A9A39F;
  --rule:rgba(55,55,55,.16); --muted:#6E6863;
  --acc-bg:rgba(168,85,49,.11); --sage-bg:rgba(157,153,129,.30);
  --title:"Besley","Times New Roman",Georgia,serif;
  --sans:"Helvetica Neue",Helvetica,"Gothic A1",Arial,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{background:var(--cream-light);color:var(--charcoal);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--charcoal-dark)}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--terracotta);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--title);font-weight:400;margin:0;color:var(--charcoal-dark);text-wrap:balance}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:900px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
.eyebrow{font:400 14px/1 var(--title);letter-spacing:.05em;text-transform:uppercase;color:var(--charcoal-dark)}
.eyebrow.lg{font-size:clamp(16px,1.6vw,21px)}
.small{font-size:14px;line-height:1.45}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums lining-nums}
.link{display:inline-flex;align-items:center;gap:10px;font:400 15px/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px;color:var(--charcoal-dark);padding:6px 0}
.link:hover{text-decoration-thickness:2px}
.link.strong{text-decoration-thickness:2px}
.link[disabled],.link[aria-disabled="true"]{opacity:.38;pointer-events:none}
.link.light{color:var(--cream)}
.logo{display:block;height:auto;color:var(--charcoal-dark)}
.logo.cream{color:var(--cream)}
.proto{display:inline-block;font:500 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;border:1px solid currentColor;padding:6px 8px;white-space:nowrap}
[hidden]{display:none!important}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--charcoal-dark);color:var(--cream)}
.hdr .wrap{display:flex;align-items:center;gap:22px;min-height:68px;padding-block:10px}
.hdr .brand{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--cream);min-width:0}
.hdr .brand svg{width:132px;flex:none}
.hdr .brand span{font:400 17px/1 var(--title);padding-left:16px;border-left:1px solid rgba(243,239,236,.3);white-space:nowrap}
.hdr nav{display:flex;gap:24px;margin-left:auto;align-items:center}
.hdr nav a{font-size:13px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:rgba(243,239,236,.78);padding:6px 0;border-bottom:1px solid transparent}
.hdr nav a:hover,.hdr nav a[aria-current="page"]{color:var(--cream);border-bottom-color:var(--cream)}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(243,239,236,.85);padding-left:20px;border-left:1px solid rgba(243,239,236,.25)}
.who img{width:28px;height:28px;object-fit:cover;flex:none}
.who b{font-weight:500;color:var(--cream);display:block;line-height:1.2}
.who small{display:block;font-size:11.5px;color:rgba(243,239,236,.65);line-height:1.2}
.who button{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px;color:rgba(243,239,236,.75);margin-left:6px}
@media(max-width:860px){.hdr .brand span{display:none}.who .wtxt{display:none}.hdr nav{gap:16px}.who{padding-left:12px}}
@media(max-width:640px){.hdr .wrap{flex-wrap:wrap;gap:6px 14px}.hdr .brand svg{width:110px}.hdr .proto{display:none}.hdr nav{order:3;width:100%;margin-left:0;border-top:1px solid rgba(243,239,236,.18);padding-top:4px}.hdr nav a{font-size:12px}.who{margin-left:auto;border-left:0}.tabs{top:calc(104px + env(safe-area-inset-top,0px))}html{scroll-padding-top:calc(150px + env(safe-area-inset-top,0px))}}
.who button{white-space:nowrap}

/* sign in */
.signin{background:var(--charcoal-dark);color:var(--cream);min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.signin .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);min-height:inherit}
.signin .form{padding-block:40px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:30px;max-width:620px;width:100%;margin-left:auto}
@media(min-width:900px){.signin .form{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:56px}}
.signin .top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.signin .top svg{width:170px}
.signin h1{color:var(--cream);font-size:clamp(44px,5.6vw,70px);line-height:1.04}
.signin p.lede{font-size:18px;line-height:1.5;color:rgba(243,239,236,.82);margin:16px 0 0;max-width:46ch}
.signin figure{margin:0;position:relative;min-height:320px;background:var(--charcoal)}
.signin figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.signin figcaption{position:absolute;left:0;bottom:0;background:var(--charcoal-dark);color:var(--cream);font:400 13px/1 var(--title);letter-spacing:.05em;text-transform:uppercase;padding:14px 18px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.fld .lb{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:inherit;opacity:.78}
.fld input,.fld select,.fld textarea{width:100%;background:transparent;border:0;border-bottom:1px solid currentColor;border-radius:0;padding:9px 0;font-size:16px;outline:none}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-bottom-width:2px;padding-bottom:8px}
.fld select option{color:var(--charcoal-dark);background:var(--cream-light)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.roles{display:flex;flex-wrap:wrap;gap:8px}
.roles label{cursor:pointer}
.roles input{position:absolute;opacity:0;pointer-events:none}
.roles span{display:inline-block;border:1px solid rgba(243,239,236,.45);padding:10px 14px;font-size:14px;transition:background .15s,color .15s}
.roles input:checked+span{background:var(--cream);color:var(--charcoal-dark);border-color:var(--cream)}
.roles input:focus-visible+span{outline:2px solid var(--terracotta);outline-offset:2px}
.err{font-size:13.5px;color:var(--cream);font-weight:500;min-height:1em}
.idnote{font-size:13px;color:rgba(243,239,236,.7);display:flex;gap:10px;align-items:center}
.idnote img{width:24px;height:24px}
@media(max-width:900px){.signin .grid{grid-template-columns:1fr}.signin figure{order:-1;min-height:0;aspect-ratio:16/9}.signin .form{margin:0;max-width:none}}
@media(max-width:480px){.row2{grid-template-columns:1fr}}

/* bands */
.band{padding-block:48px 64px}
.band.white{background:var(--white)}
.band.cream{background:var(--cream)}
.band.dark{background:var(--charcoal);color:var(--cream)}
.band.dark h2,.band.dark h1,.band.dark .eyebrow{color:var(--cream)}
.secthead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.secthead h2{font-size:clamp(30px,3.4vw,45px);line-height:1.1;margin-top:14px;letter-spacing:-.5px}

/* storefront */
.welcome h1{font-size:clamp(40px,5vw,62px);line-height:1.06;margin-top:16px;letter-spacing:-.5px}
.welcome p{font-size:clamp(17px,1.6vw,21px);max-width:58ch;margin:18px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:40px;border-top:1px solid var(--charcoal-dark)}
.stat{padding:18px 18px 4px 0}
.stat+.stat{padding-left:22px;border-left:1px solid var(--rule)}
.stat b{display:block;font:400 clamp(36px,4.4vw,62px)/1 var(--title);color:var(--charcoal-dark);font-variant-numeric:lining-nums}
.stat span{display:block;font-size:14px;margin-top:10px;max-width:22ch}
@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){padding-left:0;border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--rule);margin-top:14px}}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 28px}
@media(max-width:1000px){.cards{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.cards{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;min-width:0}
.card .ph{aspect-ratio:4/3;overflow:hidden;background:var(--cream)}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.card:hover .ph img{transform:scale(1.03)}
.card .meta{padding-top:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:clamp(28px,2.6vw,36px);line-height:1.1}
.card .one{font-size:15.5px;margin:0}
.card dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:12px 0 0;border-top:1px solid var(--rule)}
.card dl div{padding:12px 10px 0 0}
.card dl div+div{padding-left:12px;border-left:1px solid var(--rule)}
.card dt{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card dd{margin:4px 0 0;font:400 19px/1.2 var(--title);color:var(--charcoal-dark);font-variant-numeric:lining-nums}
.card .go{margin-top:auto;padding-top:16px}
.excl{display:inline-block;font:500 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;background:var(--charcoal-dark);color:var(--cream);padding:2px 6px;margin-left:10px;vertical-align:1px}

/* scheme */
.hero{background:var(--charcoal-dark);color:var(--cream)}
.hero .img{position:relative;aspect-ratio:21/9;max-height:62vh;width:100%;overflow:hidden;background:var(--charcoal)}
.hero .img img{width:100%;height:100%;object-fit:cover}
@media(max-width:720px){.hero .img{aspect-ratio:4/3}}
.hero .ttl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding-block:30px 26px}
.hero h1{color:var(--cream);font-size:clamp(42px,6vw,70px);line-height:1.04}
.hero .addr{margin-top:12px;font-size:15px;color:rgba(243,239,236,.78)}
.back{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:rgba(243,239,236,.78);text-decoration:none;display:inline-block;margin-bottom:18px}
.back:hover{color:var(--cream);text-decoration:underline;text-underline-offset:4px}
@media(max-width:720px){.hero .ttl{grid-template-columns:1fr}}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid rgba(243,239,236,.3)}
.strip div{padding:16px 14px 20px 0;min-width:0}
.strip div+div{padding-left:18px;border-left:1px solid rgba(243,239,236,.2)}
.strip span{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(243,239,236,.65)}
.strip b{display:block;font:400 clamp(18px,1.7vw,23px)/1.2 var(--title);color:var(--cream);margin-top:6px;font-variant-numeric:lining-nums}
@media(max-width:860px){.strip{grid-template-columns:1fr 1fr}.strip div,.strip div+div{padding:14px 12px 14px 0;border-left:0;border-bottom:1px solid rgba(243,239,236,.15)}.strip div:nth-child(even){padding-left:14px;border-left:1px solid rgba(243,239,236,.15)}.strip div:last-child{grid-column:1/-1;padding-left:0;border-left:0}}
.tabs{position:sticky;top:calc(68px + env(safe-area-inset-top,0px));z-index:30;background:var(--cream-light);border-bottom:1px solid var(--rule)}
.tabs .wrap{display:flex;gap:30px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs button{font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:20px 0 17px;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--charcoal-dark);border-bottom-color:var(--charcoal-dark)}
.tabs button:hover{color:var(--charcoal-dark)}
.pane{padding-block:44px 72px}

.info{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;align-items:start}
@media(max-width:900px){.info{grid-template-columns:1fr;gap:36px}}
.info .intro{font-size:clamp(19px,1.8vw,24px);line-height:1.45;color:var(--charcoal-dark);margin:16px 0 0;max-width:40ch}
.sell{list-style:none;margin:28px 0 0;padding:0;border-top:1px solid var(--charcoal-dark)}
.sell li{display:grid;grid-template-columns:36px minmax(0,1fr);padding:14px 0;border-bottom:1px solid var(--rule);font-size:16px}
.sell li::before{content:"";width:14px;height:1px;background:var(--charcoal-dark);margin-top:12px}
.facts{margin:0;border-top:1px solid var(--charcoal-dark)}
.facts div{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:15px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;color:var(--charcoal-dark);font-weight:500}
.terms{margin-top:30px;background:var(--cream);padding:22px 24px}
.terms h3{font-size:24px;margin-top:10px}
.terms p{margin:10px 0 0;font-size:15px}

/* availability */
.filters{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;padding-bottom:18px;border-bottom:1px solid var(--charcoal-dark)}
.seg{display:flex;gap:0;border:1px solid var(--rule)}
.seg button{padding:9px 13px;font-size:13.5px;color:var(--muted);border-left:1px solid var(--rule)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--charcoal-dark);color:var(--cream)}
.fgroup{display:flex;flex-direction:column;gap:6px}
.fgroup>span{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fgroup select{border:1px solid var(--rule);background:var(--white);padding:9px 10px;font-size:14px;border-radius:0;min-width:150px}
.counts{margin-left:auto;font-size:14px;text-align:right}
.counts b{font:400 26px/1 var(--title);color:var(--charcoal-dark);display:block}
@media(max-width:720px){.counts{margin-left:0;text-align:left}}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.units{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums lining-nums;min-width:760px}
.units th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-align:left;font-weight:500;color:var(--muted);padding:16px 12px 10px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
.units td{padding:13px 12px 13px 0;border-bottom:1px solid var(--rule);white-space:nowrap;font-size:15px}
.units .r{text-align:right}
.units tbody tr{cursor:pointer;transition:background .12s}
.units tbody tr:hover,.units tbody tr:focus-visible{background:var(--cream)}
.units .un{font:400 22px/1 var(--title);color:var(--charcoal-dark)}
.units .pr{font:400 18px/1 var(--title);color:var(--charcoal-dark)}
.units tr.sel{background:var(--cream)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 9px;font-size:12.5px;font-weight:500;letter-spacing:.02em}
.pill::before{content:"";width:7px;height:7px;background:currentColor}
.s-available{color:var(--terracotta);background:var(--acc-bg)}
.s-reserved{color:var(--charcoal-dark);background:transparent;outline:1px solid var(--charcoal-dark);outline-offset:-1px}
.s-legals{color:var(--charcoal-darkest);background:var(--sage-bg)}
.s-exchanged{color:var(--muted);background:var(--cream)}
.s-reserved::before{background:transparent;border:1.5px solid currentColor;width:7px;height:7px}
.s-exchanged::before{width:9px;height:2px}
.mine{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.empty{padding:56px 0;text-align:center;border-bottom:1px solid var(--rule)}
.empty b{display:block;font:400 26px/1.2 var(--title);color:var(--charcoal-dark);margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:16px;font-size:13px;color:var(--muted)}
.srcnote{margin-top:14px;font-size:13px;color:var(--muted)}

/* assets */
.gallery{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.gallery figure{margin:0;grid-column:span 4;background:var(--cream);aspect-ratio:4/3;overflow:hidden;position:relative}
.gallery figure.wide{grid-column:span 8}
.gallery figure img{width:100%;height:100%;object-fit:cover}
.gallery figcaption{position:absolute;left:0;bottom:0;background:var(--cream-light);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:7px 10px}
@media(max-width:720px){.gallery figure,.gallery figure.wide{grid-column:span 12}}
.docs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--charcoal-dark);margin-top:40px}
.docs div{padding:18px 16px 18px 0;border-bottom:1px solid var(--rule);min-width:0}
.docs div+div{padding-left:16px;border-left:1px solid var(--rule)}
.docs b{display:block;font:400 21px/1.2 var(--title);color:var(--charcoal-dark)}
.docs span{display:block;font-size:13.5px;color:var(--muted);margin-top:6px}
@media(max-width:860px){.docs{grid-template-columns:1fr 1fr}.docs div:nth-child(3){padding-left:0;border-left:0}}
.wl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px;margin-top:56px;background:var(--white);padding:34px}
.wl h3{font-size:clamp(26px,2.6vw,34px);margin-top:12px}
.wl .fld{color:var(--charcoal-dark)}
.wl form{display:flex;flex-direction:column;gap:18px}
.wlprev{border:1px solid var(--rule);padding:18px;background:var(--cream-light);font-size:14px}
.wlprev .pl{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:12px;min-height:44px}
.wlprev .pl img{max-height:40px;max-width:140px;object-fit:contain}
.wlprev .pl b{font-size:16px}
.chk{display:flex;gap:10px;align-items:center;font-size:14.5px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--charcoal-dark)}
@media(max-width:900px){.wl{grid-template-columns:1fr;padding:22px;gap:28px}}

/* faqs */
.faqs{border-top:1px solid var(--charcoal-dark);max-width:880px}
.faqs details{border-bottom:1px solid var(--rule)}
.faqs summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;padding:20px 0;font:400 clamp(19px,1.8vw,23px)/1.3 var(--title);color:var(--charcoal-dark)}
.faqs summary::-webkit-details-marker{display:none}
.faqs summary::after{content:"+";font-family:var(--sans);font-size:24px;line-height:1;flex:none;transition:transform .2s}
.faqs details[open] summary::after{transform:rotate(45deg)}
.faqs p{margin:0 0 22px;max-width:68ch;font-size:16px}

/* ask */
.ask{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:48px;align-items:start}
@media(max-width:900px){.ask{grid-template-columns:1fr;gap:30px}}
.askbox{background:var(--white);padding:26px}
.askbox textarea{width:100%;min-height:96px;border:1px solid var(--rule);background:var(--cream-light);padding:14px;font-size:16px;resize:vertical;border-radius:0;outline:none}
.askbox textarea:focus{border-color:var(--charcoal-dark)}

/* talk to the development partner */
.wa{display:inline-flex;align-items:center;gap:8px;font:400 13px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--charcoal-dark);padding:11px 14px;border:1px solid var(--charcoal-dark);white-space:nowrap}

.wa.line:hover,.wa.light:hover{background:var(--cream);color:var(--charcoal-dark)}
.heroacts{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.talk{background:var(--charcoal-darkest);color:var(--cream)}
.talk .wrap{padding-block:56px}

.talk .eyebrow{color:rgba(243,239,236,.7)}
.talk h2{color:var(--cream);font-size:clamp(30px,3.4vw,46px);line-height:1.08;margin-top:14px}
.talk p{color:rgba(243,239,236,.78);margin:14px 0 0;max-width:52ch}
.talk-acts{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:flex-end}

.talkrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:22px;padding:16px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.talkrow span{font:400 19px/1.3 var(--title);color:var(--charcoal-dark);margin-right:auto}
.talkcard{background:var(--white);padding:22px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--charcoal-dark)}

.talkcard>div:last-child{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}

.drawer .dbtns .wa{padding:9px 12px;font-size:12px}

.mic{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--charcoal-dark);padding:10px 14px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--charcoal-dark)}

.b2{display:flex;flex-direction:column;gap:18px;padding-top:6px}

/* open, send, draft */
.sd{position:fixed;inset:0;z-index:95;background:rgba(41,37,35,.72);display:flex;align-items:stretch;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sd-box{background:var(--cream-light);width:min(1240px,100%);display:flex;flex-direction:column;min-height:0}
.sd-h{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--charcoal-darkest);color:var(--cream);padding:14px 22px}
.sd-h .eyebrow{color:rgba(243,239,236,.7);font-size:12px}
.sd-h b{display:block;font:400 20px/1.25 var(--title);margin-top:4px;color:var(--cream)}
.sd-hacts{display:flex;gap:20px;flex:none}
.sd-b{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);flex:1;min-height:0}

.sd-nopv{margin:auto;background:var(--cream-light);padding:28px;max-width:380px;text-align:left}

.sd-r textarea:focus{border-color:var(--charcoal-dark)}

.sd-ai label .ic{width:16px;height:16px;color:var(--terracotta)}
.sd-ai input{width:100%;border:0;border-bottom:1px solid currentColor;background:transparent;padding:8px 0;font-size:15px;outline:none}
.sd-ai textarea{background:var(--cream-light)}
.sd-tone{display:flex;gap:6px;flex-wrap:wrap}
.sd-tone button{border:1px solid var(--rule);padding:6px 11px;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.sd-tone button[aria-pressed="true"]{background:var(--charcoal-dark);color:var(--cream);border-color:var(--charcoal-dark)}
.sd-acts{display:flex;flex-wrap:wrap;gap:8px}
.sd-acts .wa{padding:10px 12px;font-size:12px;cursor:pointer;background:transparent}

.wa.solid2:hover{background:var(--charcoal-darkest)}
@media(max-width:900px){.sd{padding:0}.sd-b{grid-template-columns:1fr;overflow-y:auto}.sd-pv{overflow:visible;max-height:none}.sd-r{overflow:visible}}

/* ===== Layer 3: after Salboy's Nobu page. White ground, light grotesque display, full bleed photography with titles bottom left, small dark tag chips, a dark facts band over a photograph, square dark buttons. ===== */
:root{
  --cream-light:#FFFFFF; --cream:#F4F2EF; --white:#FFFFFF;
  --charcoal:#3A3A3A; --charcoal-dark:#1F1F1F; --charcoal-darkest:#141414;
  --rule:rgba(20,20,20,.12); --muted:#707070; --hairline:#BDBDBD;
  --title:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
}
body{background:#fff;color:#2b2b2b;font-size:16px}
h1,h2,h3,h4{font-family:var(--title);font-weight:300;letter-spacing:-.02em;color:var(--charcoal-dark)}
.eyebrow{font:500 12px/1.2 var(--title);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.band{padding-block:88px 96px}
.band.white{background:#fff}.band.cream{background:var(--cream)}
.band.dark{background:var(--charcoal-darkest)}
.secthead{margin-bottom:40px}
.secthead h2{font-size:clamp(34px,4vw,56px);line-height:1.04;letter-spacing:-.03em}
/* header: white, quiet, Salboy style */
.hdr{background:rgba(255,255,255,.96);color:var(--charcoal-dark);border-bottom:1px solid var(--rule);backdrop-filter:saturate(1.2) blur(8px)}
body::before{background:#fff}
.hdr .brand{color:var(--charcoal-dark)}
.hdr .brand svg{color:var(--charcoal-dark)}
.hdr .brand span{font:400 16px/1 var(--title);border-left-color:var(--rule);color:var(--charcoal-dark)}
.hdr nav a{color:#555;font:500 12.5px/1 var(--title);letter-spacing:.12em}
.hdr nav a:hover,.hdr nav a[aria-current="page"]{color:var(--charcoal-dark);border-bottom-color:var(--charcoal-dark)}
.who{color:#555;border-left-color:var(--rule)}.who b{color:var(--charcoal-dark)}.who small{color:var(--muted)}.who button{color:#555}
.hdr .proto{color:var(--muted)}
@media(max-width:640px){.hdr nav{border-top-color:var(--rule)}}
/* chips */
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;font:500 11px/1 var(--title);letter-spacing:.1em;text-transform:uppercase;background:var(--charcoal-darkest);color:#fff;padding:7px 10px;border-radius:2px}
.chip.lt{background:#fff;color:var(--charcoal-dark)}
/* buttons: square, dark, like Register Now */
.link.strong{background:var(--charcoal-darkest);color:#fff;text-decoration:none;padding:14px 20px;border-radius:2px;font:500 12.5px/1 var(--title);letter-spacing:.12em}
.link.strong:hover{background:#000;text-decoration:none}
.link.light.strong{background:#fff;color:var(--charcoal-darkest)}
.link.light.strong:hover{background:#eee}
.link{font:500 12.5px/1 var(--title);letter-spacing:.12em}
.wa{border-radius:2px;font:500 12px/1 var(--title);letter-spacing:.1em}
.wa-fab{border-radius:2px;background:var(--charcoal-darkest);font:500 12px/1 var(--title);letter-spacing:.1em}
/* heroes: full bleed, title bottom left, light display */
.dhero>img{aspect-ratio:auto;height:min(82vh,820px);min-height:440px;max-height:none}
.dhero .cap{background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 100%);padding-block:180px 64px}
.dhero h1{font-weight:300;font-size:clamp(52px,8vw,120px);letter-spacing:-.04em;line-height:.95;margin-top:22px;color:#fff}
.sk-hero>img,.sk-hero>video{aspect-ratio:auto;height:min(84vh,860px);min-height:460px;max-height:none}
.sk-hero .cap{background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.6) 100%);padding-block:200px 56px}
.sk-hero h1{font-weight:300;font-size:clamp(56px,8.5vw,128px);letter-spacing:-.045em;line-height:.92;color:#fff;margin-top:14px}
.sk-hero .addr{font:400 17px/1.4 var(--title);color:rgba(255,255,255,.9);margin-top:14px}
.sk-hero .back{font:500 12px/1 var(--title);letter-spacing:.12em;color:rgba(255,255,255,.85)}
@media(max-width:720px){.sk-hero>img,.sk-hero>video{height:78vh;min-height:420px}.dhero>img{height:70vh;min-height:380px}}
.hero.strip-only{background:#fff;color:var(--charcoal-dark);border-bottom:1px solid var(--rule)}
.hero.strip-only .strip{border-top:0}
.strip div+div{border-left-color:var(--rule)}
.strip span{color:var(--muted);font:500 11px/1 var(--title);letter-spacing:.12em}
.strip b{color:var(--charcoal-dark);font:300 clamp(20px,1.9vw,26px)/1.2 var(--title);letter-spacing:-.01em}
@media(max-width:860px){.strip div,.strip div+div{border-bottom-color:var(--rule)}.strip div:nth-child(even){border-left-color:var(--rule)}}
.tabs{background:#fff;top:calc(68px + env(safe-area-inset-top,0px))}
.tabs button{font:500 12.5px/1 var(--title);letter-spacing:.12em;padding:22px 0 19px}
.tabs button[aria-selected="true"]{border-bottom-width:2px}
/* scheme cards */
.scard{gap:14px}
.scard .ph{aspect-ratio:4/5;border-radius:2px}
.scard .chips2{position:absolute;left:14px;top:14px}
.scard h3{font-size:clamp(28px,2.4vw,36px);letter-spacing:-.025em;line-height:1.05}
.sloc{font:400 15px/1.3 var(--title);color:var(--muted);margin-top:6px}
.scard .ln{border-top-color:var(--rule);font-family:var(--title)}
.scard .ln b{font:400 17px/1.2 var(--title)}
.more2{font:500 12.5px/1 var(--title);letter-spacing:.12em;text-transform:uppercase;color:var(--charcoal-dark)}
.more2 i{font-style:normal;color:var(--terracotta);margin-left:4px}
.scard:hover .more2{text-decoration:underline;text-underline-offset:5px}
.scard.soon .ph{background:var(--charcoal-darkest)}
.soonph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:22px;background:linear-gradient(160deg,#2a2a2a,#0d0d0d)}
.soonph span{font:300 clamp(48px,5vw,72px)/1 var(--title);letter-spacing:-.04em;color:rgba(255,255,255,.92)}
/* overview */
.ov-intro .big{font:300 clamp(26px,2.8vw,42px)/1.25 var(--title);letter-spacing:-.02em;color:var(--charcoal-dark)}
.dev h2,.acc summary{font-weight:300;letter-spacing:-.025em}
.q2{font:300 clamp(18px,1.5vw,22px)/1.55 var(--title);color:#333}
.q2 footer{font:500 12px/1.3 var(--title);letter-spacing:.12em}
.dev-m img,.acc-m img,.media-m .wrap img,.lead figure img,.pair img{border-radius:2px}
.factsband{position:relative;background:var(--charcoal-darkest);color:#fff;overflow:hidden}
.factsband>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38}
.factsband::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.2))}
.fb-in{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px;padding-block:96px 104px;align-items:start}
.factsband .eyebrow{color:rgba(255,255,255,.7)}
.factsband h2{color:#fff;font-size:clamp(36px,4vw,58px);line-height:1.02;margin-top:14px;letter-spacing:-.03em}
.chev{list-style:none;margin:0;padding:0;columns:2;column-gap:40px}
.chev li{break-inside:avoid;display:flex;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.18);font:300 19px/1.35 var(--title);color:#fff}
.chev li::before{content:"›";color:rgba(255,255,255,.7);font-weight:400}
@media(max-width:860px){.fb-in{grid-template-columns:1fr;gap:24px;padding-block:64px}.chev{columns:1}}
.ogal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:minmax(0,auto);gap:10px}
.ogal figure{margin:0;position:relative;overflow:hidden;background:var(--cream);border-radius:2px}
.ogal img{width:100%;height:100%;object-fit:cover;transition:transform .8s ease}
.ogal figure:hover img{transform:scale(1.03)}
.ogal figcaption{position:absolute;left:10px;bottom:10px;font:500 11px/1 var(--title);letter-spacing:.1em;text-transform:uppercase;background:#fff;color:var(--charcoal-dark);padding:7px 9px;border-radius:2px}
.ogal .g0{grid-column:span 8;aspect-ratio:16/10}
.ogal .g1{grid-column:span 4;aspect-ratio:auto}
.ogal .g2,.ogal .g3,.ogal .g4{grid-column:span 4;aspect-ratio:4/3}
.ogal .g5{grid-column:span 6;aspect-ratio:16/10}.ogal .g6{grid-column:span 6;aspect-ratio:16/10}
@media(max-width:720px){.ogal .g0,.ogal .g1,.ogal .g5,.ogal .g6{grid-column:span 12;aspect-ratio:4/3}.ogal .g2,.ogal .g3,.ogal .g4{grid-column:span 6}.ogal .g4{display:none}}
.nums,.talk,.foot,.sum,.listbar{background:var(--charcoal-darkest)}
.ntiles b,.stiles b{font-family:var(--title);font-weight:300;letter-spacing:-.02em}
.talk h2{font-weight:300;letter-spacing:-.03em}
.kv b,.facts dd,.docrow b,.talkcard b,.hch h3,.units .un,.units .pr,.counts b,.terms h3,.faqs summary,.icard h3,.feat h2,.ihead h1,.q,.empty b,.loadblk p,.busy p,.signin h1{font-family:var(--title);font-weight:300;letter-spacing:-.015em}
.faqs summary{font-size:clamp(20px,1.8vw,24px)}
.hcard{border-radius:2px}
.units .un{font-size:24px}.units .pr{font-size:19px}
.pill{border-radius:2px;font-family:var(--title)}
/* sign in: the hub's own wall, white type */
.signin{background:var(--charcoal-darkest)}
.signin h1{color:#fff;font-size:clamp(52px,6.4vw,96px);letter-spacing:-.045em;line-height:.95}
.signin .wall{background:#0d0d0d}
/* insights */
.ihead h1{font-size:clamp(60px,9vw,132px);letter-spacing:-.05em}
.icard h3{font-size:clamp(22px,1.9vw,28px)}
.chipset button{border-radius:2px;font:500 12px/1 var(--title);letter-spacing:.1em}
.mosaic figcaption,.mcap{font:500 11.5px/1 var(--title);letter-spacing:.1em;border-radius:2px}
.foot{color:rgba(255,255,255,.65)}

.lgrid{display:flex;flex-direction:column;gap:12px}
.lsc{background:#fff;border:1px solid var(--rule);border-radius:2px}
.lsc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding:20px 22px}
.lsc summary::-webkit-details-marker{display:none}
.lname{font:300 26px/1.1 var(--title);letter-spacing:-.02em;color:var(--charcoal-dark)}
.lcount{font:400 14px/1.3 var(--title);color:var(--muted)}.lcount b{color:var(--charcoal-dark);font-weight:500}
.lbar{display:flex;gap:22px;padding:0 22px 8px}
.ltable{min-width:640px;margin:0 22px 18px;width:calc(100% - 44px)}
.ltable input{width:20px;height:20px;accent-color:var(--charcoal-dark);cursor:pointer}
.ltable .r{text-align:right}
.ltable tr.hid td{opacity:.45}.ltable tr.hid td:first-child{opacity:1}

/* ===== hub additions: profile, visual assets, stamp duty, partners, mail shots ===== */
.hdr nav{min-width:0}
@media(max-width:640px){.hdr nav{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap;gap:18px}.hdr nav::-webkit-scrollbar{display:none}.hdr nav a{white-space:nowrap}}
@media(min-width:641px) and (max-width:1100px){.hdr nav{gap:14px}.hdr nav a{font-size:11.5px;letter-spacing:.08em}.hdr .proto{display:none}}
.who .pfl{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px;color:#555;white-space:nowrap}
.who .blogo{height:26px;max-width:70px;object-fit:contain}

/* page heroes for the tools */
.thero{position:relative;background:var(--charcoal-darkest);overflow:hidden}
.thero>img{width:100%;height:min(56vh,560px);min-height:340px;object-fit:cover;display:block}
.thero .cap{position:absolute;inset:auto 0 0;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.62) 100%);padding-block:150px 48px;color:#fff}
.thero h1{color:#fff;font-weight:300;font-size:clamp(52px,8vw,118px);letter-spacing:-.045em;line-height:.94;margin-top:16px}
.thero p{margin:14px 0 0;font:400 clamp(16px,1.5vw,20px)/1.45 var(--title);color:rgba(255,255,255,.88);max-width:54ch}

/* toolkit tiles on the storefront */
.tk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:1000px){.tk{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.tk{grid-template-columns:1fr}}
.tile{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;border-radius:2px;background:var(--charcoal-darkest);text-decoration:none;color:#fff}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .8s ease}
.tile:hover img{transform:scale(1.04)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72) 100%)}
.tile .tcap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:22px}
.tile .tcap .eyebrow{color:rgba(255,255,255,.75)}
.tile h3{color:#fff;font-size:clamp(26px,2.4vw,34px);line-height:1.05;margin-top:8px}
.tile p{margin:8px 0 0;font-size:14px;color:rgba(255,255,255,.85);max-width:30ch}
@media(max-width:520px){.tile{aspect-ratio:16/10}}
.nudge{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;background:#fff;border:1px solid var(--rule);border-left:3px solid var(--terracotta);padding:16px 20px;margin-bottom:28px;border-radius:2px}
.nudge b{font:300 21px/1.25 var(--title);color:var(--charcoal-dark)}
.nudge span{display:block;font-size:14px;color:var(--muted);margin-top:4px}

/* visual document library */
.brandstrip{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px;background:var(--cream);border-radius:2px;margin-bottom:28px}
.brandstrip .bl2{width:96px;height:38px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--rule);padding:4px}
.brandstrip .bl2 img{max-width:100%;max-height:100%;object-fit:contain}
.brandstrip .bl2 span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brandstrip p{margin:0;font-size:14.5px;color:var(--charcoal-dark);flex:1;min-width:200px}
.brandstrip p small{display:block;color:var(--muted);font-size:13px}
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px 18px}
@media(max-width:1100px){.dgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:800px){.dgrid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.dgrid{grid-template-columns:1fr}}
.dcard{display:flex;flex-direction:column;gap:14px;min-width:0}
.dph{position:relative;display:block;width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--cream);border-radius:2px;text-align:left;cursor:pointer;text-decoration:none}
.dph img{width:100%;height:100%;object-fit:cover;transition:transform .8s ease}
.dph:hover img{transform:scale(1.04)}
.dph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%);pointer-events:none}
.dtag{position:absolute;left:10px;top:10px;z-index:1;font:500 10.5px/1 var(--title);letter-spacing:.1em;text-transform:uppercase;background:#fff;color:var(--charcoal-dark);padding:7px 9px;border-radius:2px}
.dtag.dk{background:var(--charcoal-darkest);color:#fff}
.dgo{position:absolute;right:12px;bottom:12px;z-index:1;font:500 11px/1 var(--title);letter-spacing:.12em;text-transform:uppercase;color:#fff}
.dcard h3{font-size:clamp(21px,1.7vw,25px);line-height:1.15}
.dcard p{margin:6px 0 0;font-size:14px;color:var(--muted);line-height:1.45}
.dcard .dacts2{display:flex;gap:18px;flex-wrap:wrap;margin-top:auto}
.dcard .dacts2 .link{font-size:12px}
.dcard.off .dph img{filter:grayscale(.85) brightness(.9)}
.dcard em{font-style:normal;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--terracotta)}

/* profile */
.prof{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:40px;align-items:start}
@media(max-width:960px){.prof{grid-template-columns:1fr}}
.pcover{position:relative;aspect-ratio:210/297;max-width:430px;width:100%;overflow:hidden;background:var(--charcoal-darkest);box-shadow:0 18px 50px rgba(0,0,0,.18);border-radius:2px;margin-inline:auto}
.pcover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcover::after{content:"";position:absolute;inset:auto 0 0;height:48%;background:linear-gradient(180deg,rgba(20,20,20,0),rgba(20,20,20,.86))}
.pcover .plogo{position:absolute;left:7.5%;top:5%;z-index:1;background:#fcf5ef;width:34%;height:7.5%;display:flex;align-items:center;justify-content:center;padding:2%}
.pcover .plogo img{max-width:100%;max-height:100%;object-fit:contain}
.pcover .plogo span{font:400 13px/1.1 var(--title);color:var(--charcoal-dark);text-align:center}
.pcover .pc{position:absolute;left:7.5%;right:7.5%;bottom:7%;z-index:1;color:#fff}
.pcover .pc small{display:block;font:500 9.5px/1 var(--title);letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.pcover .pc b{display:block;font:300 clamp(30px,3.4vw,44px)/1 var(--title);letter-spacing:-.03em;margin-top:10px}
.pcover .pc i{display:block;font-style:normal;font-size:12.5px;opacity:.85;margin-top:12px;border-top:1px solid rgba(255,255,255,.35);padding-top:10px}
.pvcap{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}
.acct{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--charcoal-dark)}
.acct div{padding:12px 12px 12px 0;border-bottom:1px solid var(--rule)}
.acct div:nth-child(even){padding-left:14px;border-left:1px solid var(--rule)}
.acct span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.acct b{display:block;font:300 19px/1.25 var(--title);color:var(--charcoal-dark);margin-top:4px}

/* stamp duty */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;align-items:stretch;box-shadow:0 18px 50px rgba(0,0,0,.08);border-radius:2px;overflow:hidden}
@media(max-width:900px){.calc{grid-template-columns:minmax(0,1fr)}}
.btype button{min-width:0}.cin,.cout{min-width:0}
@media(max-width:480px){.btbl td,.btbl th{font-size:13px;padding-right:6px}.cout .tot{font-size:52px}}
.cin{background:#fff;padding:clamp(22px,3.4vw,44px);display:flex;flex-direction:column;gap:22px;color:var(--charcoal-dark)}
.bigin{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--charcoal-dark);padding-bottom:6px}
.bigin span{font:300 clamp(40px,5vw,64px)/1 var(--title);color:var(--muted)}
.bigin input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:300 clamp(40px,5vw,64px)/1.05 var(--title);letter-spacing:-.03em;color:var(--charcoal-dark);padding:0}
.btype{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:480px){.btype{grid-template-columns:1fr}}
.btype button{border:1px solid var(--rule);padding:16px 14px;text-align:left;border-radius:2px;display:flex;flex-direction:column;gap:6px;transition:background .15s,border-color .15s}
.btype button b{font:400 16px/1.2 var(--title);color:var(--charcoal-dark)}
.btype button small{font-size:12.5px;color:var(--muted);line-height:1.35}
.btype button[aria-pressed="true"]{background:var(--charcoal-darkest);border-color:var(--charcoal-darkest)}
.btype button[aria-pressed="true"] b{color:#fff}.btype button[aria-pressed="true"] small{color:rgba(255,255,255,.7)}
.tog{display:flex;align-items:center;gap:14px;cursor:pointer;padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog .sw{width:46px;height:26px;border-radius:13px;background:#d6d3cf;position:relative;flex:none;transition:background .15s}
.tog .sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog input:checked+.sw{background:var(--charcoal-darkest)}
.tog input:checked+.sw::after{transform:translateX(20px)}
.tog input:focus-visible+.sw{outline:2px solid var(--terracotta);outline-offset:2px}
.tog b{display:block;font:400 16px/1.2 var(--title);color:var(--charcoal-dark)}
.tog small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.cin .fgroup select{width:100%}
.cout{background:var(--charcoal-darkest);color:#fff;padding:clamp(22px,3.4vw,44px);display:flex;flex-direction:column;gap:18px}
.cout .eyebrow{color:rgba(255,255,255,.65)}
.cout .tot{font:300 clamp(56px,7vw,96px)/.95 var(--title);letter-spacing:-.045em;font-variant-numeric:lining-nums;margin-top:6px}
.cout .eff{font-size:15px;color:rgba(255,255,255,.75)}
.cout .eff b{color:#fff;font-weight:500}
.btbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums lining-nums}
.btbl th{font:500 10.5px/1 var(--title);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);text-align:left;padding:0 8px 10px 0;border-bottom:1px solid rgba(255,255,255,.3)}
.btbl td{padding:12px 8px 12px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:14.5px;color:rgba(255,255,255,.88)}
.btbl .r{text-align:right}
.btbl tr.z td{color:rgba(255,255,255,.45)}
.btbl tfoot td{font:300 20px/1.2 var(--title);color:#fff;border-bottom:0;padding-top:14px}
.cnote{font-size:13px;color:rgba(255,255,255,.62);margin:0}
.cnote.hi{color:#fff;background:rgba(255,255,255,.08);padding:10px 12px;border-left:2px solid var(--terracotta)}
.cacts{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:6px}
.rates{margin-top:56px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
@media(max-width:860px){.rates{grid-template-columns:1fr}}
.rates h3{font-size:22px;padding-bottom:10px;border-bottom:1px solid var(--charcoal-dark)}
.rates dl{margin:0}
.rates dl div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.rates dt{color:var(--muted)}.rates dd{margin:0;color:var(--charcoal-dark);font-weight:500}

/* partners */
.pcat{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:44px;align-items:start;padding-block:56px;border-top:1px solid var(--rule)}
.pcat:first-child{border-top:0;padding-top:0}
@media(max-width:900px){.pcat{grid-template-columns:1fr;gap:22px}}
.pcat figure{margin:0;position:sticky;top:140px}
@media(max-width:900px){.pcat figure{position:static}}
.pcat figure img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:2px}
.pcat h2{font-size:clamp(32px,3.4vw,48px);line-height:1.04;margin-top:18px}
.pcat figure p{font-size:15.5px;color:var(--muted);margin:12px 0 0;max-width:44ch}
.plist{display:flex;flex-direction:column;gap:14px}
.pcard{display:grid;grid-template-columns:96px minmax(0,1fr);gap:20px;background:#fff;border:1px solid var(--rule);padding:20px;border-radius:2px}
@media(max-width:480px){.pcard{grid-template-columns:64px minmax(0,1fr);gap:14px;padding:16px}}
.pmono{width:100%;aspect-ratio:1;background:var(--charcoal-darkest);color:#fff;display:flex;align-items:center;justify-content:center;font:300 32px/1 var(--title);letter-spacing:-.02em;border-radius:2px;overflow:hidden}
.pmono img{width:100%;height:100%;object-fit:cover}
.pmono.fit img{object-fit:contain;padding:14%}
.pmono.light{background:#fff;border:1px solid var(--rule,#ddd)}
.pcard h3{font-size:clamp(22px,2vw,28px);line-height:1.1;margin-top:6px}
.pcard p{margin:6px 0 0;font-size:14.5px;color:var(--charcoal)}
.pcard .pc2{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:10px;font-size:14px}
.pcard .pc2 a{color:var(--charcoal-dark);text-decoration:none;border-bottom:1px solid var(--rule)}
.pcard .pacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.pcard .pacts .wa{padding:9px 12px;font-size:11.5px}
.pempty{background:var(--cream);padding:26px;border-radius:2px}
.pempty b{display:block;font:300 22px/1.25 var(--title);color:var(--charcoal-dark)}
.pempty p{margin:8px 0 14px;font-size:14.5px;color:var(--muted);max-width:52ch}

/* mail shots */
.mctl{display:flex;flex-wrap:wrap;gap:22px 34px;align-items:flex-end;padding-bottom:22px;border-bottom:1px solid var(--charcoal-dark);margin-bottom:30px}
.mctl .fgroup input{border:1px solid var(--rule);background:#fff;padding:9px 10px;font-size:15px;width:110px;border-radius:0}
.mctl .sig{font-size:14px;color:var(--charcoal-dark)}
.mctl .sig a{color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:start}
@media(max-width:1100px){.mgrid{grid-template-columns:1fr;max-width:640px;margin-inline:auto}}
.mstep{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.mstep i{font:400 13px/1 var(--title);font-style:normal;color:var(--terracotta)}
.mstep b{font:300 22px/1.2 var(--title);color:var(--charcoal-dark)}
.mstep span{font-size:13px;color:var(--muted);margin-left:auto}
.mprev{background:#fff;border:1px solid var(--rule);box-shadow:0 12px 34px rgba(0,0,0,.07);border-radius:2px;overflow:hidden;font-size:14.5px;color:#2b2b2b}
.mprev .msub{padding:12px 16px;border-bottom:1px solid var(--rule);font-size:12.5px;color:var(--muted);background:#fafafa}
.mprev .msub b{color:var(--charcoal-dark);font-weight:500}
.mprev .mlogo{padding:16px 22px;min-height:58px;display:flex;align-items:center}
.mprev .mlogo img{max-height:30px;max-width:150px;object-fit:contain}
.mprev .mlogo span{font:400 16px/1 var(--title);color:var(--charcoal-dark)}
.mprev .mimg{aspect-ratio:16/9;overflow:hidden;background:var(--cream)}
.mprev .mimg img{width:100%;height:100%;object-fit:cover}
.mprev .mbody{padding:22px}
.mprev h3{font-size:clamp(24px,2.1vw,30px);line-height:1.08}
.mprev .maddr{font-size:13px;color:var(--muted);margin-top:6px}
.mprev .mbody p{margin:12px 0 0;line-height:1.55}
.mtiles{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;border-top:1px solid var(--charcoal-dark)}
.mtiles div{padding:10px 10px 10px 0;border-bottom:1px solid var(--rule)}
.mtiles div:nth-child(even){padding-left:12px;border-left:1px solid var(--rule)}
.mtiles span{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mtiles b{display:block;font:300 19px/1.2 var(--title);color:var(--charcoal-dark);margin-top:4px}
.mbtn{display:inline-block;margin-top:18px;background:var(--charcoal-darkest);color:#fff;padding:13px 18px;font:500 11.5px/1 var(--title);letter-spacing:.12em;text-transform:uppercase;border-radius:2px}
.msign{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule);font-size:13.5px;line-height:1.5;color:var(--charcoal)}
.msign b{font-weight:500;color:var(--charcoal-dark)}
.mfine{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.45}
.macts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.macts .wa{padding:10px 12px;font-size:11.5px;cursor:pointer;background:transparent}
.macts .wa.solid2{background:var(--charcoal-darkest);color:#fff;border-color:var(--charcoal-darkest)}

/* toolkit */
.tktabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:28px}
@media(max-width:900px){.tktabs{grid-template-columns:1fr 1fr}}
.tktabs a{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;padding:10px;border:1px solid var(--rule);background:#fff;text-decoration:none;border-radius:2px;transition:border-color .15s,background .15s}
.tktabs a img{width:72px;height:72px;object-fit:cover;border-radius:2px}
.tktabs b{display:block;font:400 17px/1.15 var(--title);color:var(--charcoal-dark)}
.tktabs small{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.35}
.tktabs a[aria-current="page"]{background:var(--charcoal-darkest);border-color:var(--charcoal-darkest)}
.tktabs a[aria-current="page"] b{color:#fff}.tktabs a[aria-current="page"] small{color:rgba(255,255,255,.7)}
@media(max-width:520px){.tktabs a{grid-template-columns:48px minmax(0,1fr);gap:10px}.tktabs a img{width:48px;height:48px}.tktabs small{display:none}}
.tkrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:560px){.tkrow{grid-template-columns:1fr 1fr}}
.tkin{display:flex;align-items:center;border-bottom:1px solid var(--charcoal-dark);gap:6px}
.tkin input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:300 24px/1.3 var(--title);color:var(--charcoal-dark);padding:6px 0}
.tkin i{font-style:normal;font-size:13px;color:var(--muted);white-space:nowrap}
.tkin:focus-within{border-bottom-color:var(--terracotta)}
.seg2{display:inline-grid;grid-auto-flow:column;border:1px solid var(--charcoal-dark);border-radius:2px;overflow:hidden;justify-self:start}
.seg2 button{padding:11px 18px;font:500 12px/1 var(--title);letter-spacing:.08em;text-transform:uppercase;color:var(--charcoal-dark)}
.seg2 button[aria-pressed="true"]{background:var(--charcoal-darkest);color:#fff}
.qchip{border:1px solid var(--rule);padding:8px 12px;margin:0 6px 6px 0;border-radius:2px;font-size:14px}
.qchip[aria-pressed="true"]{background:var(--charcoal-darkest);color:#fff;border-color:var(--charcoal-darkest)}
.split{display:flex;height:10px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,.12)}
.split span:first-child{background:#fff}.split span:last-child{background:var(--terracotta)}
.splitk{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:rgba(255,255,255,.75)}
.splitk i{display:inline-block;width:9px;height:9px;margin-right:7px;background:#fff;border-radius:1px}
.splitk span:last-child i{background:var(--terracotta)}
.ostats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(255,255,255,.3)}
.ostats div{padding:12px 10px 12px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.ostats div:nth-child(even){padding-left:14px;border-left:1px solid rgba(255,255,255,.12)}
.ostats span{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.ostats b{display:block;font:300 22px/1.2 var(--title);color:#fff;margin-top:4px;font-variant-numeric:lining-nums}
.gchart{width:100%;height:auto;display:block}
.mstrip{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:center;margin-top:48px;border-top:1px solid var(--charcoal-dark);padding-top:22px;text-decoration:none;color:inherit}
.mstrip img{width:200px;aspect-ratio:16/10;object-fit:cover;border-radius:2px}
.mstrip small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mstrip b{display:block;font:300 30px/1.1 var(--title);color:var(--charcoal-dark);margin-top:6px}
.mstrip i{display:block;font-style:normal;font-size:14.5px;color:var(--charcoal);margin-top:6px}
@media(max-width:560px){.mstrip{grid-template-columns:1fr}.mstrip img{width:100%}}
/* coming soon scheme */
.scard.soon .ph{background:var(--charcoal-darkest);display:flex;align-items:flex-end;padding:22px;color:#fff;position:relative;overflow:hidden}
.scard.soon .ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 1px,transparent 1px 22px)}
.scard.soon .ph div{position:relative}
.scard.soon .ph span{display:inline-block;font:500 10.5px/1 var(--title);letter-spacing:.12em;text-transform:uppercase;background:#fff;color:var(--charcoal-dark);padding:7px 9px;border-radius:2px}
.scard.soon .ph b{display:block;font:300 clamp(52px,5vw,76px)/.95 var(--title);letter-spacing:-.04em;margin-top:14px}
.scard.soon .ph em{display:block;font-style:normal;font-size:13px;color:rgba(255,255,255,.7);margin-top:8px}
/* partner extras */

 ["regeneration-s-non-negotiable-collaboration","Regeneration's Non-Negotiable: Collaboration","News","2026-04-12","pl-sk8","Regeneration comes wrapped in opportunity, that's why towns everywhere are entering periods of transformation. New housing, upgraded public spaces and major infrastructure projects are reshaping places that have struggled with years of declining high streets and catastrophic dips in investment."],
 ["stockport-mdc-more-growth","Stockport MDC: More Growth","Stockport","2026-04-05","pl-roofs","Since our last Brik-Down on the Stockport Mayoral Development Corporation (MDC), there's been a big update. So, let's get back into it."],
 ["manchesters-talent-engine","Manchester's Talent Engine","Manchester","2026-03-29","pl-inter","Manchester used to get labelled as a 'regional city', but the last decade has seen the city outgrow this title to become a strong, self-sustaining standalone. A place that produces talent, holds onto it, attracts more and feeds what it's got through industry opportunity and investment."],

 ["purpose-before-profit-what-happened","Purpose Before Profit: What Happened?","News","2026-02-23","pl-archstreet","The UK counts some of Europe's most enduring residential buildings among its streets. Red-brick terraces, stone-built workers' housing, mansion blocks and Grade II listed addresses that have lived through generations of use, economic extremes and even survived war."],

 ["case-study-wroclaw-poland-a-city-that-chose-to-rebuild","Case Study: Wrocław, Poland. A City That Chose To Rebuild","News","2026-01-04","pl-oldmap","Wrocław is one of Europe's most quietly successful regeneration stories. What followed was not a single flagship project, but a long-term, coordinated commitment to rebuilding the city as a place to live, not just a place to pass through."],
 ["the-density-question-fulfilling-or-just-full","The Density Question: Fulfilling or Just Full?","News","2025-12-16","pl-town","If we're starting to worry about density, chances are it's already here. Towers are up, streets are busy and rents have found their level. But, like regeneration, density doesn't begin with numbers, it begins with people."],

 ["manchester-boom-delivery-vs-demand","Manchester Boom: Delivery vs Demand","Manchester","2025-12-01","pl-city","Manchester's city centre has been on the up for a decade: population, cranes and rent. But are we seeing the height of the boom, or is this just the middle act of a much longer story. Our question is whether delivery still matches demand."],
 ["eyes-on-europe-lessons-in-urban-regeneration","Eyes on Europe: Lessons in Urban Regeneration","News","2025-11-25","pl-exch","When it comes to regeneration, the UK loves to lead with PR. But over in Europe, the most successful neighbourhoods grew from frameworks. What can we learn from them and how can we switch modes?"],

function boot(){
  S.session=store.get("session",null);S.brand=loadBrand();
  S.assume={...ASSUME0};S.contact={...CONTACT0,...store.get("contact",{})};S.listing={};S.showHidden=true;

  if(!window.claude||!window.claude.use)return;
  claude.use("user").then(async u=>{user=u;if(!u)return;try{const me=await u.me();S.me=me;S.meId=me.id;S.isAdmin=!!(await u.canEdit());render();subRes();subBrand()}catch(e){}});

  claude.use("downloads").then(d=>{downloads=d;render()});
  claude.use("dictation").then(d=>{dict=d;bindDictation();render()});
  claude.use("db").then(d=>{db=d;if(!d)return;
    d.collection("units").onSnapshot(snap=>{
      if(snap.empty){S.unitsLoaded=true;render();return}
      const m={};snap.docs.forEach(doc=>{const v=doc.data();m[doc.id]={id:doc.id,...v}});
      S.units=m;S.unitsLive=true;S.unitsLoaded=true;
      if(S.drawer&&m[S.drawer.id])S.drawer=m[S.drawer.id];

    subRes();subBrand();subContact();subListing();subExtras();
  });
}
/* Reservations hold buyer details, so each partner writes only under resv/<their id> (db rule resv/{self});
   only viewers with edit access (BRIK admins) can read the whole resv collection. */
let resUnsub=null;
function subRes(){
  if(!db||!S.meId||resUnsub)return;
  const toList=docs=>{const out=[];docs.forEach(doc=>{if(!doc.exists)return;const items=(doc.data()||{}).items||{};Object.entries(items).forEach(([rid,v])=>out.push({id:rid,_uid:doc.id,...v}))});return out.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))};
  if(S.isAdmin)resUnsub=db.collection("resv").onSnapshot(snap=>{S.reservations=toList(snap.docs);S.resLive=true;render()},()=>{});
  else resUnsub=db.doc("resv/"+S.meId).onSnapshot(snap=>{S.reservations=toList([snap]);S.resLive=true;render()},()=>{});
}

function route(){const h=(location.hash||"").slice(1);if(!S.session)return {v:"signin"};

  if(h==="mailers"||h.startsWith("mailers-"))return {v:"mailers",id:h.slice(8)||undefined};

function render(){
  const r=route();const app=$("#app");
  const focusId=document.activeElement&&document.activeElement.id;
  let html="";
  if(r.v==="signin")html=vSignin();
  else{html=vHeader(r)+(r.v==="store"?vStore():r.v==="scheme"?vScheme(r.id):r.v==="insights"?vInsights():r.v==="profile"?vProfile():r.v==="tools"?vTools(r.t):r.v==="partners"?vPartners():r.v==="mailers"?vMailers(r.id):vAdmin())+vFoot()}
  if(S.drawer&&r.v==="scheme")html+=vDrawer(S.drawer);
  if(r.v!=="signin")html+=fab();
  const keep={};app.querySelectorAll("input[id],textarea[id]").forEach(el=>{if(el.type!=="file"&&el.type!=="checkbox"&&el.type!=="radio"&&el.value)keep[el.id]=el.value});
  const radio=(app.querySelector("input[name=role]:checked")||{}).value;
  app.innerHTML=html;
  Object.entries(keep).forEach(([id,v])=>{const el=document.getElementById(id);if(el&&!el.readOnly&&!el.value)el.value=v});
  if(radio){const rb=app.querySelector(`input[name=role][value="${radio}"]`);if(rb)rb.checked=true}
  bind(r);
  if(focusId){const el=document.getElementById(focusId);if(el&&el.focus&&el.tagName!=="BUTTON")try{el.focus({preventScroll:true});if(el.setSelectionRange&&el.value)el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}
}

/* website copy splits into paragraphs; short lines with no full stop read as bullet facts, as on brik-studios.com */
function richText(t){
  const ps=String(t||"").split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);let out="",list=[];
  const flush=()=>{if(list.length){out+=`<ul class="bl">${list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;list=[]}};
  ps.forEach(p=>{if(p.length<120&&!/[.”"]$/.test(p))list.push(p);else{flush();out+=`<p>${esc(p)}</p>`}});flush();return out;
}

function bind(r){
  const f=$("#signinForm");
  if(f)f.addEventListener("submit",e=>{e.preventDefault();
    const name=$("#si-name").value.trim(),company=$("#si-co").value.trim(),email=$("#si-email").value.trim();
    const role=(f.querySelector("input[name=role]:checked")||{}).value||"Agent";
    if(!name){$("#si-err").textContent="Enter your name to sign in.";$("#si-name").focus();return}
    if(role==="BRIK Admin"&&!S.isAdmin){$("#si-err").textContent="BRIK Admin needs edit access to this portal.";return}
    if(email&&!/^\S+@\S+\.\S+$/.test(email)){$("#si-err").textContent="That email address looks incomplete.";$("#si-email").focus();return}
    S.session={name,company,email,role,at:Date.now()};store.set("session",S.session);store.set("lastSignin",{name,company,email,role});
    if(location.hash!=="#portfolio")location.hash="portfolio";else render();window.scrollTo(0,0)});
  const so=$("#signout");if(so)so.onclick=()=>{HUB.signOut();S.session=null;S.client=newClient();S.rentOverride={};store.del("session");S.drawer=null;location.hash="";render()};
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();const t=$(".tabs");if(t)t.scrollIntoView({block:"start"})});
  document.querySelectorAll("[data-beds]").forEach(b=>b.onclick=()=>{S.filters.beds=b.dataset.beds;render()});
  const ff=$("#f-floor");if(ff)ff.onchange=()=>{S.filters.floor=ff.value;render()};
  const fs=$("#f-status");if(fs)fs.onchange=()=>{S.filters.status=fs.value;render()};
  const cf=$("#clearF");if(cf)cf.onclick=()=>{S.filters={beds:"all",floor:"all",status:"all"};render()};
  document.querySelectorAll("tr[data-unit]").forEach(tr=>{const open=()=>{S.drawer=S.units[tr.dataset.unit];S.drawerMode="";render();const c=$("#dr-close");c&&c.focus()};
    tr.onclick=open;tr.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}}});
  const close=()=>{S.drawer=null;S.drawerMode="";render()};
  const dc=$("#dr-close");if(dc)dc.onclick=close;const sc=$("#scrim");if(sc)sc.onclick=close;
  const al=$("#act-link");if(al)al.onclick=()=>{S.drawerMode=S.drawerMode==="link"?"":"link";render();const n=$("#rb-name");n&&n.focus()};
  const rf=$("#resForm");if(rf)rf.addEventListener("submit",e=>{e.preventDefault();reserve(S.drawer)});
  const cl=$("#copyLink");if(cl)cl.onclick=()=>{const i=$("#res-link");navigator.clipboard.writeText(i.value).then(()=>toast("Link copied"),()=>{i.select();toast("Select and copy the link")})};
  // ask
  const af=$("#askForm");if(af){af.addEventListener("submit",e=>{e.preventDefault();const q=$("#ask-q").value.trim();if(q)ask(SCH[route().id],q)});
    $("#ask-q").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))af.requestSubmit()})}
  document.querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>{if(!sample){toast("Ask works when the portal is opened on claude.ai");return}ask(SCH[route().id],b.dataset.ask)});
  // insights and imagery
  document.querySelectorAll("[data-icat]").forEach(b=>b.onclick=()=>{S.icat=b.dataset.icat;render()});
  document.querySelectorAll("[data-icat-go]").forEach(b=>b.onclick=()=>{S.icat=b.dataset.icatGo;location.hash="insights"});
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const u=b.dataset.copy;
    try{navigator.clipboard.writeText(u).then(()=>toast("Link copied"),()=>toast(u))}catch(e){toast(u)}});
  document.querySelectorAll("[data-dl]").forEach(b=>b.onclick=async()=>{if(!downloads)return;const k=b.dataset.dl;
    try{toast("Preparing image");const r=await fetch("dl/"+k+".jpg");const blob=await r.blob();
      await downloads.save({filename:"BRIK "+k+".jpg",data:blob});toast("Image saved")}
    catch(e){if(e&&e.code==="declined")return;toast(e&&e.code==="rate_limited"?"A save is already open":"That image could not be saved. Try again.")}});
  // admin
  S.pending=S.pending||{};
  document.querySelectorAll("[data-ask-release]").forEach(b=>b.onclick=()=>{S.pending["rel:"+b.dataset.askRelease]=1;render()});

async function reserve(u){
  const name=$("#rb-name").value.trim(),email=$("#rb-email").value.trim(),err=$("#rb-err");
  if(!name){err.textContent="Enter the buyer's name.";$("#rb-name").focus();return}
  if(!/^\S+@\S+\.\S+$/.test(email)){err.textContent="Enter the buyer's email address in full.";$("#rb-email").focus();return}
  const ref=schemeCode[u.scheme]+String(u.unit).padStart(2,"0")+" "+code(4);
  const link="https://pay.example/brik/reserve/"+ref.replace(" ","");
  const now=new Date().toISOString();const s=S.session;
  const rec={ref,link,scheme:u.scheme,unit:u.unit,unitId:u.id,price:u.price,fee:RES_TERMS.fee,buyerName:name,buyerEmail:email,
    agentName:s.name,agentCompany:s.company||"",agentEmail:s.email||"",agentRole:s.role,createdAt:now,createdBy:S.meId||null,status:"Reserved",paymentTaken:false};
  let saved=false;
  if(db){
    try{
      const cur=await db.doc("units/"+u.id).get();
      if(cur.exists&&stKey(cur.data().status)!=="available"){err.textContent="Another partner has just reserved this unit.";return}
      const rid=ref.replace(" ","");
      if(!S.meId){err.textContent="Sign in to claude.ai to save reservations.";return}
      const mine=db.doc("resv/"+S.meId);const ex=await mine.get();
      if(ex.exists)await mine.update({items:{[rid]:rec}});else await mine.set({items:{[rid]:rec}});
      await db.doc("units/"+u.id).update({status:"Reserved",reservationId:rid,reservedAt:now,reservedBy:S.meId||null});
      saved=true;
    }catch(e){err.textContent="The reservation could not be saved ("+(e&&e.code||"error")+"). Try again in a moment.";return}
  }
  S.lastRes={...rec,saved};S.drawerMode="";
  if(!saved){S.units[u.id]={...u,status:"Reserved",reservedAt:now};S.drawer=S.units[u.id]}
  render();const rs=$(".result");if(rs)rs.scrollIntoView({block:"nearest"});toast(saved?"Unit "+u.unit+" reserved. Link ready to copy.":"Link created. Not saved to the shared list.");
}
async function releaseRes(rid){
  delete S.pending["rel:"+rid];const r=S.reservations.find(x=>x.id===rid);if(!r||!db||!S.isAdmin)return;
  try{const u=S.units[r.unitId];
    await db.doc("resv/"+r._uid).update({items:{[rid]:{status:"Released",releasedAt:new Date().toISOString()}}});
    if(u&&u.reservationId===rid)await db.doc("units/"+u.id).update({status:u.sfStatus||"Available",reservationId:null,reservedBy:null,reservedAt:null});

  }catch(e){toast("Could not release: "+(e&&e.code||"error"))}
}
async function resetUnit(id,quiet){
  delete S.pending["u:"+id];const u=S.units[id];if(!u||!db||!S.isAdmin){render();return}

/* ============ RETURNS MODEL (after the Charter House ROI Calculator workbook) ============ */
const SDLT_BANDS=[[125000,0],[250000,.02],[925000,.05],[1500000,.10],[Infinity,.12]];
function sdlt(p,o){const add=(o.buyer==="additional"?.05:0)+(o.nonUK?.02:0);let t=0,prev=0;for(const [cap,r] of SDLT_BANDS){if(p>prev)t+=(Math.min(p,cap)-prev)*(r+add);prev=cap}return Math.round(t)}
const ASSUME0={ltv:70,rate:4.5,capGrowth:4,rentGrowth:4,uplift:3,mgmt:12,legal:1950,buyer:"additional",nonUK:false};
function fin(u,o){
  if(!u)return null;o={...ASSUME0,...(o||{})};
  const R=o.rent!=null&&o.rent!==""?+o.rent:rentFor(u);if(!R)return null;
  const P=u.price,sc=u.serviceChargeAnnual||Math.round((SCH[u.scheme].scRate||0)*u.sqft),gr=u.groundRent||0;
  const loan=P*o.ltv/100,tax=sdlt(P,o);
  const pay={reserve:RES_TERMS.fee,exchange:P*.2,completion:Math.max(0,P-loan-P*.2-RES_TERMS.credited),sdlt:tax,legal:+o.legal||0};
  const cash=pay.reserve+pay.exchange+pay.completion+pay.sdlt+pay.legal;
  const gross=R*12,mgmt=gross*o.mgmt/100,mort=loan*o.rate/100,netPre=gross-mgmt-sc-gr,net=netPre-mort;
  const v0=P*(1+o.uplift/100);const years=[];let cum=0;
  for(let n=1;n<=20;n++){const g=gross*Math.pow(1+o.rentGrowth/100,n-1),m=g*o.mgmt/100,ni=g-m-sc-gr-mort;cum+=ni;const val=v0*Math.pow(1+o.capGrowth/100,n);
    years.push({n,val,gross:g,net:ni,cum,gain:val-P,total:val-P+cum,roi:(val-P+cum)/cash})}
  const exits=[5,10,15,20].map(n=>{const y=years[n-1];return {n,gain:y.gain,income:y.cum,total:y.total,roi:y.roi,ann:y.roi/n}});
  return {u,P,R,sc,gr,loan,tax,pay,cash,gross,mgmt,mort,netPre,net,grossYield:gross/P,netYield:netPre/P,coc:net/cash,v0,years,exits,o};
}

/* ============ BRICKS: every loading moment lays a wall ============ */
const BRICK_COLS=["#9A4630","#A8553A","#8E412D","#B2603F","#7F3A28","#A24C34","#B66A47","#94452F"];
function mountBricks(root=document){
  root.querySelectorAll("[data-bricks]:not([data-bm])").forEach(el=>{el.dataset.bm="1";
    const big=el.dataset.bricks==="wall";const cv=document.createElement("canvas");el.appendChild(cv);const x=cv.getContext("2d");
    const still=matchMedia("(prefers-reduced-motion: reduce)").matches;let bricks=[],t0=0,W=0,H=0,raf=0,done=0;
    const bw=big?64:22,bh=big?20:7,mj=big?5:2;
    const setup=()=>{const r=el.getBoundingClientRect();const d=devicePixelRatio||1;W=Math.max(40,r.width);H=Math.max(30,r.height);cv.width=W*d;cv.height=H*d;cv.style.width=W+"px";cv.style.height=H+"px";x.setTransform(d,0,0,d,0,0);
      bricks=[];const rows=Math.floor((H-mj)/(bh+mj));const order=[];for(let r=0;r<rows;r++){const y=H-(r+1)*(bh+mj);const off=r%2?-(bw+mj)/2:0;const row=[];for(let cx=off;cx<W;cx+=bw+mj)row.push({x:cx,y,c:BRICK_COLS[Math.floor(Math.random()*BRICK_COLS.length)],s:Math.random()});
        if(r%2)row.reverse();order.push(...row)}
      bricks=order;step=Math.max(big?14:30,Math.min(big?70:55,(big?11000:2400)/Math.max(1,bricks.length)));t0=performance.now()};
    let step=big?70:55;const dur=big?380:260,hold=big?2600:900;
    const draw=now=>{if(!el.isConnected){cancelAnimationFrame(raf);return}x.clearRect(0,0,W,H);const t=still?1e9:now-t0;
      let laid=0;for(let i=0;i<bricks.length;i++){const b=bricks[i];const p=Math.min(1,Math.max(0,(t-i*step)/dur));if(p<=0)break;laid=i;
        const e=1-Math.pow(1-p,3);const y=b.y-(1-e)*(big?46:16);
        x.fillStyle="rgba(214,204,192,"+(.85*Math.min(1,p*3))+")";x.fillRect(b.x-mj/2,b.y+bh,bw+mj,mj);
        x.globalAlpha=Math.min(1,p*2.2);x.fillStyle=b.c;x.fillRect(b.x,y,bw,bh);
        x.fillStyle="rgba(0,0,0,"+(.10+.12*b.s)+")";x.fillRect(b.x,y+bh*.62,bw,bh*.38);
        x.fillStyle="rgba(255,236,220,"+(.06+.08*(1-b.s))+")";x.fillRect(b.x,y,bw,bh*.18);x.globalAlpha=1}
      const end=(bricks.length-1)*step+dur;if(!still&&t>end+hold){t0=now;bricks.forEach(b=>b.c=BRICK_COLS[Math.floor(Math.random()*BRICK_COLS.length)])}
      if(!still)raf=requestAnimationFrame(draw)};
    setup();if(window.ResizeObserver){let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(setup,150)}).observe(el)}
    raf=requestAnimationFrame(draw)});
}

async function runDoc(kind,unitId){
  const sc=SCH[route().id]||SCH[(S.units[unitId]||{}).scheme];const u=S.units[unitId||S.selUnit];
  if(kind==="title")return;
  if(kind==="guide"||kind==="film"){const src=kind==="guide"?"docs/stockport-guide.pdf":WEB[sc.id].film;const name=kind==="guide"?"Stockport guide, BRIK Studios.pdf":sc.name+" film.mp4";
    if(!downloads){toast("Downloads are not available in this browser");return}
    const done=busy(kind==="guide"?"Fetching the Stockport guide":"Fetching the film");try{const blob=await (await fetch(src)).blob();done();await downloads.save({filename:name,data:blob});toast("Saved")}catch(e){done();if(!(e&&e.code==="declined"))toast("That file could not be saved. Try again.")}return}
  if(kind==="solicitor"&&!u){toast("Choose a unit under Personalise first");return}
  if((kind==="proposal"||kind==="numbers")&&!fin(u,assumeFor(u))){toast("Add a monthly rent for this unit in Assets first");return}
  const msg={proposal:"Laying out your proposal",numbers:"Laying out the numbers",form:"Laying out the reservation form",formblank:"Laying out a blank form",pricelist:"Laying out the price list",solicitor:"Laying out the solicitor confirmation"}[kind];
  const done=busy(msg);let out;
  try{out=kind==="proposal"?await pdfProposal(u):kind==="numbers"?await pdfNumbers(u):kind==="form"?await pdfForm(u,false):kind==="formblank"?await pdfForm(u,true):kind==="solicitor"?await pdfSolicitor(u):await pdfPriceList(sc.id)}
  catch(e){done();toast(e&&e.message&&/PDF tools/.test(e.message)?e.message:"The document could not be built. Try again.");console.error(e);return}
  window.__lastPdf={name:out.name,blob:out.d.output("blob")};done();
  openSend(out,kind,u?u.id:null);
}

  const pz=$("#dr-personalise");if(pz)pz.onclick=()=>{S.selUnit=S.drawer.id;S.drawer=null;S.tab="assets";render();const t=$(".tabs");t&&t.scrollIntoView({block:"start"})};

async function ask(sc,q){

Rules:

2. If the answer is not in the DATA, reply exactly: "I don't know that from the information I have. Please contact the BRIK team." You may add one short sentence saying what the data does cover.
3. Answer in plain UK English, briefly (under 120 words). Use £ and sq ft. Never use dashes or hyphens of any kind; write "1 to 2 bed", "Q1 2028".
4. Unit statuses are live from the portal. Gross yield = rent estimate × 12 ÷ price. Rent estimates are estimates, not guarantees.
5. Do not give financial or legal advice; everything is subject to contract.

DATA:
${JSON.stringify(ctx)}

QUESTION: ${q}`;
  const clean=t=>t.replace(/\s*[–—]\s*/g,", ").replace(/(\w)[‐‑-](\w)/g,"$1 $2");
  try{const {text}=await sample(prompt,{cache:false,onText:({text})=>{text=clean(text);item.a=text;item.wait=false;const el=document.querySelectorAll(".thread .a")[0];if(el&&route().id===sc.id&&S.tab==="ask"){el.textContent=text;el.classList.remove("wait")}}});

  render();
}

/* ---------- stamp duty ---------- */
const SDT={ftb:["First time buyer","Never owned a home anywhere, buying to live in. Relief up to £500,000."],mover:["Home mover","Buying a main home and not keeping another. Standard rates."],additional:["Additional home","Buy to let or a second home. 5% on top of every band."]};
function sdltCalc(price,type,os){const p=Math.max(0,Math.floor(+price||0));let bands=[[125000,0],[250000,.02],[925000,.05],[1500000,.10],[Infinity,.12]];const notes=[];
  if(type==="ftb"){if(p<=500000)bands=[[300000,0],[500000,.05]];else if(p)notes.push("First time buyer relief stops at £500,000, so standard rates apply to this price.")}
  let add=os?.02:0;if(type==="additional"){if(p&&p<40000)notes.push("Under £40,000 the additional home rates do not apply.");else add+=.05}
  const rows=[];let prev=0;for(const [cap,r] of bands){const top=Math.min(p,cap);rows.push({from:prev,cap,rate:r+add,taxed:Math.max(0,top-prev),tax:Math.max(0,top-prev)*(r+add)});prev=cap}
  const total=Math.floor(rows.reduce((s,x)=>s+x.tax,0));return {p,rows,total,eff:p?total/p:0,notes}}
const bandLabel=(r,i,rows)=>r.cap===Infinity?"Above "+gbp(r.from):i===0?"Up to "+gbp(r.cap):gbp(r.from+1)+" to "+gbp(r.cap);
const pctR=x=>{const v=Math.round(x*1000)/10;return (Number.isInteger(v)?v:v.toFixed(1))+"%"};
function sdOutHTML(){const s=S.sd;const c=sdltCalc(s.price,s.type,s.overseas);
  return `<div><div class="eyebrow">Stamp duty to pay${s.label?" · "+esc(s.label):""}</div><div class="tot num">${gbp(c.total)}</div></div>
   <div class="eff">${c.p?`Effective rate <b>${pctR(c.eff)}</b> on ${gbp(c.p)} · ${esc(SDT[s.type][0])}${s.overseas?", overseas":""}`:"Enter a purchase price to see the stamp duty."}</div>
   ${c.notes.map(n=>`<p class="cnote hi">${esc(n)}</p>`).join("")}
   <table class="btbl"><thead><tr><th>Band</th><th class="r">Rate</th><th class="r">Taxed</th><th class="r">Tax</th></tr></thead><tbody>
    ${c.rows.map((r,i)=>`<tr class="${r.taxed?"":"z"}"><td>${esc(bandLabel(r,i,c.rows))}</td><td class="r">${pctR(r.rate)}</td><td class="r">${gbp(r.taxed)}</td><td class="r">${gbp(r.tax)}</td></tr>`).join("")}
   </tbody><tfoot><tr><td colspan="3">Total</td><td class="r">${gbp(c.total)}</td></tr></tfoot></table>
   <p class="cnote">Residential rates for England and Northern Ireland. A guide for your client, not tax advice; their solicitor confirms the final figure.</p>
   <div class="cacts"><button class="link light strong" type="button" data-act="sdprint" ${c.p?"":"disabled"}>Print calculation →</button><button class="link light" type="button" data-act="sdcopy" ${c.p?"":"disabled"}>Copy figures</button></div>`}

  bFoot(d,"Stamp duty");return {d,name:`Stamp duty calculation ${gbp(c.p).replace("£","")}${s.label?", "+s.label:""}.pdf`}}

function mortCalc(){const s=S.sd,P=num(s.price),dep=Math.min(100,num(s.dep)),loan=P*(1-dep/100),r=num(s.rate)/1200,n=Math.max(1,Math.round(num(s.term)))*12;
  const io=s.mode==="io";const pmt=!loan?0:io?loan*r:(r?loan*r/(1-Math.pow(1+r,-n)):loan/n);const repaid=io?pmt*n+loan:pmt*n;const interest=repaid-loan;
  const bal=y=>{if(io)return loan;const k=y*12;return r?loan*Math.pow(1+r,k)-pmt*(Math.pow(1+r,k)-1)/r:loan-pmt*k};
  const sd=sdltCalc(P,s.type,s.overseas).total;const ys=[5,10,15,20,25,30,35].filter(y=>y<=n/12);
  return {P,dep,deposit:P*dep/100,loan,pmt,repaid,interest,n,io,sd,rows:ys.map(y=>({y,bal:Math.max(0,bal(y)),paid:pmt*y*12}))}}
